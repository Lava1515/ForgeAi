<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ForgeAi uploader</title>
<style>
  :root { --bg:#0e1014; --card:#171a21; --line:#272c37; --ink:#e7e9ee; --dim:#98a0b0; --ember:#f08a3c; --ok:#4cc38a; --bad:#f0616d; --warn:#e6b450; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.45 system-ui,Segoe UI,Roboto,sans-serif; }
  header { display:flex; align-items:center; gap:16px; padding:14px 20px; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--bg); z-index:2; }
  header h1 { font-size:16px; margin:0; font-weight:600; }
  header .grow { flex:1; }
  main { max-width:1100px; margin:0 auto; padding:20px; display:grid; gap:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; }
  .card h2 { font-size:15px; margin:0; font-weight:600; }
  .row { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .dim { color:var(--dim); } .small { font-size:12px; }
  .pill { font-size:11px; padding:2px 8px; border-radius:999px; border:1px solid var(--line); color:var(--dim); white-space:nowrap; }
  .pill.ok { color:var(--ok); border-color:#245c44; } .pill.bad { color:var(--bad); border-color:#6b2a31; } .pill.warn { color:var(--warn); border-color:#6b5524; }
  button, .btn { font:inherit; font-size:12px; color:var(--ink); background:#212632; border:1px solid var(--line); border-radius:8px; padding:6px 10px; cursor:pointer; text-decoration:none; display:inline-block; }
  button:hover, .btn:hover { border-color:#3a4252; }
  button.primary, .btn.primary { background:var(--ember); border-color:var(--ember); color:#1a1206; font-weight:600; }
  button.danger { color:var(--bad); }
  button:disabled { opacity:.5; cursor:default; }
  input[type=text], input[type=number] { font:inherit; font-size:13px; color:var(--ink); background:#0f1218; border:1px solid var(--line); border-radius:8px; padding:6px 8px; }
  .problem { border-color:#6b2a31; background:#22151a; color:#ffc9ce; }
  .cols { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-top:14px; }
  @media (max-width:760px) { .cols { grid-template-columns:1fr; } }
  h3 { font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--dim); margin:0 0 8px; font-weight:600; }
  ul { list-style:none; margin:0; padding:0; display:grid; gap:6px; }
  li.item { display:flex; align-items:center; gap:8px; padding:8px 10px; border:1px solid var(--line); border-radius:8px; background:#12151b; }
  li.item .t { flex:1; min-width:0; }
  li.item .t b { display:block; font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .empty { color:var(--dim); font-size:12px; padding:6px 0; }
  .settings { margin-top:14px; padding-top:12px; border-top:1px solid var(--line); }
  a { color:var(--ember); }
  #toast { position:fixed; bottom:16px; left:50%; transform:translateX(-50%); background:#22151a; border:1px solid #6b2a31; color:#ffc9ce; padding:10px 14px; border-radius:10px; display:none; max-width:90vw; }
</style>
</head>
<body>
<header>
  <h1>ForgeAi uploader</h1>
  <span id="clock" class="dim small"></span>
  <span class="grow"></span>
  <span id="allState" class="pill"></span>
  <button id="pauseAll"></button>
  <a class="btn primary" href="/api/youtube/connect">Connect a channel</a>
</header>
<main id="main"><div class="card dim">Loading...</div></main>
<div id="toast" role="alert"></div>
<script src="/app.js"></script>
</body>
</html>
